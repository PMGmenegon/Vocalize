<!doctype html>
<html lang="pt-BR" data-accent="us">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b22234" />
    <meta
      name="description"
      content="Vocalize: aprenda inglês ouvindo, transcrevendo e conversando com uma IA."
    />
    <title>Vocalize — aprenda inglês ouvindo</title>
    <script>
      // Aplica o tema salvo ANTES do React carregar, para a página não "piscar"
      // no tema errado. A chave deve ser a mesma de src/theme/accents.ts.
      try {
        var saved = localStorage.getItem('vocalize:accent')
        var accent = saved === 'uk' ? 'uk' : 'us'
        document.documentElement.dataset.accent = accent
        if (accent === 'uk') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#012169')
        }
      } catch (e) {
        /* sem localStorage: fica no tema padrão (us) */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

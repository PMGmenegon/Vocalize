name: Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Mesma versão de Python do backend/Dockerfile.
      UV_PYTHON: "3.12"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar Python
        run: uv python install

      - name: Instalar dependências (com grupo dev)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formatação)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest (inclui integração com Testcontainers)
        run: uv run pytest

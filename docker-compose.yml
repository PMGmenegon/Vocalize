# Ambiente de desenvolvimento do Vocalize.
# Uso: docker compose up --build   (a partir da raiz do repositório)
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Recarrega a API quando o código muda (volume abaixo).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  # Ainda não usado pela API (Fase 5); já fica pronto.
  db:
    image: postgres:16
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocalize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocalize_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vocalize}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
